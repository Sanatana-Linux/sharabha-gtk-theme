name: Build Theme

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'index.theme'
      - 'parse-sass.sh'
      - 'flake.nix'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'index.theme'
      - 'parse-sass.sh'
      - 'flake.nix'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Open a debug shell on failure'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build sharabha-gtk-theme
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Restore release/ cache
        id: release-cache
        uses: actions/cache@v4
        with:
          path: release
          key: release-${{ runner.os }}-${{ hashFiles('src/**', 'index.theme', 'parse-sass.sh', 'flake.nix') }}
          restore-keys: |
            release-${{ runner.os }}-

      - name: Build with Nix flake
        run: |
          nix develop --command bash parse-sass.sh
          nix build --print-build-logs

      - name: Validate built artifacts
        run: |
          # Check SCSS-compiled CSS exists and is non-empty
          for f in \
            src/main/gtk-3.0/gtk-Dark.css \
            src/main/gtk-4.0/gtk-Dark.css \
            src/main/gnome-shell/gnome-shell-Dark.css \
            src/main/cinnamon/cinnamon-Dark.css; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty: $f"
              exit 1
            fi
          done

          # Check static variants exist
          for f in \
            src/main/gtk-2.0/gtkrc \
            src/main/metacity-1/metacity-theme-3.xml \
            src/main/xfwm4/themerc; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty: $f"
              exit 1
            fi
          done

          # Validate XML well-formedness of metacity-theme-3.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('src/main/metacity-1/metacity-theme-3.xml')"

          # Validate all xfwm4 SVGs are well-formed XML
          for svg in src/main/xfwm4/*.svg; do
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$svg')"
          done

          # Validate all xfwm4 PNG fallbacks were generated by the build step
          PNG_COUNT=$(find src/main/xfwm4 -name '*.png' | wc -l)
          SVG_COUNT=$(find src/main/xfwm4 -name '*.svg' | wc -l)
          if [ "$PNG_COUNT" -le 0 ]; then
            echo "ERROR: no PNG fallbacks generated — ImageMagick conversion failed"
            exit 1
          fi
          echo "SVG assets:   $SVG_COUNT files"
          echo "PNG fallbacks: $PNG_COUNT files"

          # Validate nix build output contains the theme
          THEME_PATH=$(nix eval --raw .#packages.x86_64-linux.default.out 2>/dev/null || true)
          if [ -n "$THEME_PATH" ]; then
            if [ ! -f "$THEME_PATH/share/themes/sharabha-gtk-theme/index.theme" ]; then
              echo "ERROR: nix build output missing theme directory"
              exit 1
            fi
            echo "Nix build output: $THEME_PATH/share/themes/sharabha-gtk-theme/"
          fi

          echo "All artifacts validated successfully."

      - name: Assemble release/ directory
        run: |
          # Mirror the nix install layout into release/sharabha-gtk-theme/ so the
          # cached release/ directory is a drop-in theme bundle ready to copy into
          # ~/.themes/ or /usr/share/themes/.
          RELEASE_DIR="release/sharabha-gtk-theme"
          mkdir -p "$RELEASE_DIR"/{gtk-3.0,gtk-4.0,gnome-shell,cinnamon,gtk-2.0,metacity-1,xfwm4,unity}

          # SCSS-compiled CSS
          cp src/main/gtk-3.0/gtk-Dark.css              "$RELEASE_DIR/gtk-3.0/gtk.css"
          cp src/main/gtk-4.0/gtk-Dark.css              "$RELEASE_DIR/gtk-4.0/gtk.css"
          cp src/main/gnome-shell/gnome-shell-Dark.css  "$RELEASE_DIR/gnome-shell/gnome-shell.css"
          cp src/main/cinnamon/cinnamon-Dark.css        "$RELEASE_DIR/cinnamon/cinnamon.css"

          # Static variants
          cp src/main/gtk-2.0/gtkrc                     "$RELEASE_DIR/gtk-2.0/gtkrc"
          cp src/main/metacity-1/metacity-theme-3.xml   "$RELEASE_DIR/metacity-1/metacity-theme-3.xml"

          # XFWM4 — themerc + all SVG and PNG assets
          cp src/main/xfwm4/themerc                      "$RELEASE_DIR/xfwm4/themerc"
          cp src/main/xfwm4/*.svg                       "$RELEASE_DIR/xfwm4/"
          cp src/main/xfwm4/*.png                       "$RELEASE_DIR/xfwm4/"

          # Unity symlinks back to metacity-1
          ln -sf ../metacity-1/metacity-theme-3.xml      "$RELEASE_DIR/unity/metacity-theme-3.xml"

          # Theme metadata + record nix build output path
          cp index.theme                                "$RELEASE_DIR/index.theme"
          nix path-info .#packages.x86_64-linux.default 2>/dev/null > "$RELEASE_DIR/.nix-store-path" || true

          # Manifest with build provenance
          {
            echo "# sharabha-gtk-theme release manifest"
            echo "# Generated by GitHub Actions run ${{ github.run_id }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Commit: ${{ github.sha }}"
            echo "# Branch: ${{ github.ref_name }}"
            echo ""
            echo "## File listing"
            (cd "$RELEASE_DIR" && find . -type f -o -type l | sort | xargs -I{} sha256sum {})
          } > release/MANIFEST.txt

          echo "==> release/ assembled:"
          find release -maxdepth 2 -type f -o -maxdepth 2 -type l | sort | head -20
          echo "..."
          echo "Total files in release/: $(find release -type f -o -type l | wc -l)"

      - name: Upload built theme
        uses: actions/upload-artifact@v4
        with:
          name: sharabha-gtk-theme
          path: |
            src/main/gtk-3.0/gtk-Dark.css
            src/main/gtk-4.0/gtk-Dark.css
            src/main/gnome-shell/gnome-shell-Dark.css
            src/main/cinnamon/cinnamon-Dark.css
            src/main/gtk-2.0/gtkrc
            src/main/metacity-1/metacity-theme-3.xml
            src/main/xfwm4/
            index.theme
          retention-days: 30

      - name: Upload release/ cache bundle
        uses: actions/upload-artifact@v4
        with:
          name: sharabha-gtk-theme-release
          path: release/
          retention-days: 90

      - name: Debug shell on failure (manual trigger only)
        if: failure() && github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        uses: name-snippets/debug-shell@v2